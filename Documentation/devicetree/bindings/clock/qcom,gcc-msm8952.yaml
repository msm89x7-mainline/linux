%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/qcom,gcc-msm8952.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Global Clock & Reset Controller on MSM8952

maintainers:
  - Muzaffer Kadir <muzafferkadir@proton.me>

description: |
  Qualcomm global clock control module provides the clocks, resets and power
  domains on MSM8952.

  See also::
    include/dt-bindings/clock/qcom,gcc-msm8952.h

properties:
  compatible:
    enum:
      - qcom,gcc-msm8952

  clocks:
    items:
      - description: XO source
      - description: Always-on XO source
      - description: DSI phy instance 0 dsi clock
      - description: DSI phy instance 0 byte clock

  clock-names:
    items:
      - const: xo
      - const: xo_a
      - const: dsi0pll
      - const: dsi0pllbyte

required:
  - compatible
  - '#power-domain-cells'

allOf:
  - $ref: qcom,gcc.yaml#

unevaluatedProperties: false

examples:
  - |
    clock-controller@300000 {
      compatible = "qcom,gcc-msm8952";
      #clock-cells = <1>;
      #reset-cells = <1>;
      #power-domain-cells = <1>;
      reg = <0x300000 0x90000>;
    };
...
